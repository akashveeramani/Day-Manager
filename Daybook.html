<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Daybook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: left rail on desktop, bottom tab bar on phones. One dark ledger-style workspace for money and deadlines. */
:root{
  color-scheme:dark;
  --bg:#0b0e15; --surface:#121723; --surface2:#1a2132; --sunk:#0d111a; --line:#252d40;
  --fg:#e9edf5; --muted:#8f99b0; --accent:#8d9bff; --accent-ink:#0b0e15;
  --in:#4fd1a5; --out:#ff7a8a; --warn:#f5b94e;
  --r:14px; --fd:'Space Grotesk',system-ui,sans-serif; --fb:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--bg);
  background-image:radial-gradient(900px 480px at 88% -8%,rgba(141,155,255,.11),transparent 60%);
  background-repeat:no-repeat;
  color:var(--fg); font:15px/1.55 var(--fb);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.15;font-weight:600}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;max-width:1200px;margin:0 auto;padding-block:28px 48px}
.side{position:sticky;top:28px;align-self:start;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:700;font-size:21px;letter-spacing:-.02em}
.brand svg{flex:none}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-i{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500}
.nav-i:hover{background:var(--surface);color:var(--fg)}
.nav-i.on{background:var(--surface2);color:var(--fg)}
.nav-i.on svg{color:var(--accent)}
.side-foot{display:flex;flex-direction:column;gap:4px;padding:0 12px}
.who{font-weight:600;overflow-wrap:anywhere}
.link{background:none;border:0;padding:0;color:var(--muted);text-align:left;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--fg)}
.main{min-width:0;display:flex;flex-direction:column;gap:24px}
.topbar,.tabbar{display:none}

/* page header */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn-primary:hover{filter:brightness(1.08);border-color:transparent}
.btn-danger{color:var(--out);border-color:rgba(255,122,138,.4);background:rgba(255,122,138,.08)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{width:100%;min-width:0;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--fg);font:inherit}
input::placeholder,textarea::placeholder{color:#59627a}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(141,155,255,.18)}
textarea{resize:vertical;min-height:84px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ico{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:0;background:none;color:var(--muted)}
.ico:hover{background:var(--surface2);color:var(--out)}
.chip{padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);font-weight:500}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:500;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill-bad{color:var(--out);border-color:rgba(255,122,138,.4);background:rgba(255,122,138,.09)}
.pill-warn{color:var(--warn);border-color:rgba(245,185,78,.4);background:rgba(245,185,78,.09)}
.pill-good{color:var(--in);border-color:rgba(79,209,165,.4);background:rgba(79,209,165,.09)}
.pill-info{color:var(--accent);border-color:rgba(141,155,255,.4);background:rgba(141,155,255,.09)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card>h2{margin-bottom:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{margin:0}
.stats{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.stat.big{background:var(--surface2)}
.stat .l{font-size:13px;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--fd);font-size:26px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat.big .v{font-size:40px;line-height:1.1}
.stat .s{font-size:13px;margin-top:6px}
.up{color:var(--in)} .down{color:var(--out)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}

/* bars */
.cb{margin-bottom:14px}
.cb:last-child{margin-bottom:0}
.cb-h{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:6px}
.cb-h em{font-style:normal;color:var(--muted);margin-left:6px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}

/* insights */
.ins-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ins{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px;border-radius:12px;background:var(--sunk);border:1px solid var(--line)}
.ins h3{margin-bottom:2px}
.ins p{color:var(--muted);font-size:14px}

/* transactions */
.tx-list{list-style:none;margin:0;padding:0}
.tx{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%}
.tx-t{font-weight:500;overflow-wrap:anywhere}
.tx-s{font-size:13px;color:var(--muted)}
.tx-a{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-a.in{color:var(--in)} .tx-a.out{color:var(--fg)}
.k-need{color:var(--in)} .k-want{color:var(--warn)}
.day-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 2px}
.day-h:first-child{margin-top:0}
.mnav{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.mnav button{width:34px;height:34px;border-radius:8px;border:0;background:none;font-size:18px}
.mnav button:hover:not(:disabled){background:var(--surface2)}
.mnav button:disabled{opacity:.3;cursor:not-allowed}
.mnav span{min-width:140px;text-align:center;font-weight:600}

/* ledger */
.ledger{display:flex;flex-direction:column}
.lr{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.lr:last-child{border-bottom:0;border-top:1px solid var(--muted);font-weight:600;font-size:17px}
.lr .num{font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:0 10px 10px 0}
td{padding:10px 10px 10px 0;border-top:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right;padding-right:0}

/* chart */
.chart{width:100%;height:auto;display:block;max-height:300px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:13px;font-family:var(--fb)}
.chart .b-in{fill:var(--in)}
.chart .b-out{fill:var(--out)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

/* wizard */
.wiz{max-width:640px}
.prog{display:flex;gap:6px;margin-bottom:22px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--accent)}
.q h2{font-size:28px;line-height:1.2;margin-bottom:8px}
.q .hint{color:var(--muted);margin-bottom:20px}
.recap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{text-align:left;padding:18px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);display:flex;flex-direction:column;gap:4px}
.opt:hover{border-color:var(--accent)}
.opt b{font-family:var(--fd);font-size:18px}
.opt span{color:var(--muted);font-size:14px}
.amt{display:flex;align-items:center;gap:10px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:6px 16px}
.amt:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(141,155,255,.18)}
.amt span{font-family:var(--fd);font-size:32px;color:var(--muted)}
.amt input{border:0;background:none;box-shadow:none!important;font-family:var(--fd);font-size:40px;font-weight:600;padding:8px 0}
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.review{display:grid;grid-template-columns:auto 1fr;gap:10px 20px;margin:0 0 4px}
.review dt{color:var(--muted)}
.review dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.err{color:var(--out);font-size:14px;min-height:20px}

/* planner */
.plan{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wd{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.wd.today{border-color:var(--accent)}
.wd small{display:block;color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.wd b{display:block;font-family:var(--fd);font-size:18px}
.wd em{display:block;font-style:normal;font-size:12px;min-height:18px;color:var(--muted)}
.wd.has em{color:var(--fg);font-weight:600}
.wd.heavy{border-color:rgba(245,185,78,.6)}
.grp{margin-bottom:22px}
.grp:last-child{margin-bottom:0}
.grp-h{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.task:last-child{margin-bottom:0}
.tick{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);background:none;display:inline-flex;align-items:center;justify-content:center;color:var(--accent-ink);padding:0;margin-top:1px}
.tick:hover{border-color:var(--accent)}
.tick.done{background:var(--in);border-color:var(--in)}
.task h3{overflow-wrap:anywhere}
.task.is-done h3{text-decoration:line-through;color:var(--muted)}
.task .det{color:var(--muted);font-size:14px;margin-top:4px;overflow-wrap:anywhere;white-space:pre-wrap}
.task .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.task .plan-hint{font-size:13px;color:var(--muted);margin-top:8px}
details summary{cursor:pointer;color:var(--muted);margin-bottom:10px}

/* auth */
.auth{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,420px);gap:64px;align-items:center;max-width:1040px;margin:0 auto;padding-block:48px;min-height:100vh}
.auth h1{font-size:44px;line-height:1.08;margin:28px 0 18px;letter-spacing:-.025em}
.auth .lead{color:var(--muted);font-size:17px;max-width:46ch}
.pts{list-style:none;padding:0;margin:28px 0 0;display:flex;flex-direction:column;gap:14px}
.pts li{display:flex;gap:12px;align-items:flex-start;color:var(--fg)}
.pts svg{color:var(--in);flex:none;margin-top:3px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:20px}
.tabs button{border:0;background:none;padding:10px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface2);color:var(--fg)}
.form{display:flex;flex-direction:column;gap:14px}
.note{font-size:13px;color:var(--muted)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--surface2);border:1px solid var(--line);padding:12px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.45)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:var(--accent);font-weight:600;margin-left:10px;text-decoration:underline}

@media (max-width:1000px){
  .plan{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:1fr 1fr}
  .stat.big{grid-column:1/-1}
  .g2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:16px 100px}
  .side{display:none}
  .topbar{display:flex;justify-content:space-between;align-items:center}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(18,23,35,.96);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));justify-content:space-around}
  .tabbar .nav-i{flex-direction:column;gap:2px;padding:6px 4px;font-size:11px;flex:1;min-width:0;text-align:center;align-items:center}
  .tabbar .nav-i span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .auth{grid-template-columns:minmax(0,1fr);gap:32px;padding-block:28px;min-height:0}
  .auth h1{font-size:34px}
  h1{font-size:25px}
  .q h2{font-size:24px}
  .amt input{font-size:32px}
  .stat.big .v{font-size:34px}
  .mnav span{min-width:110px}
}
@media (max-width:480px){
  .row2,.opts{grid-template-columns:minmax(0,1fr)}
  .week{gap:4px}
  .tx{grid-template-columns:auto minmax(0,1fr) auto}
  .tx .ico{grid-column:3;grid-row:2;justify-self:end}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,el)=>(el||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const mem={};
const store={
  get(k){try{const v=localStorage.getItem(k);if(v!==null)return JSON.parse(v);}catch(e){} return mem[k]===undefined?null:mem[k];},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
const nf0=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',minimumFractionDigits:0,maximumFractionDigits:2});
const fmt=n=>(n<0?'−':'')+nf0.format(Math.abs(Math.round(n)));
const fmt2=n=>nf2.format(n);
const fmtS=n=>(n<0?'−':'+')+nf0.format(Math.abs(Math.round(n)));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayS=()=>dstr(new Date());
const ym=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const parseD=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addM=(m,n)=>{const p=m.split('-').map(Number);return ym(new Date(p[0],p[1]-1+n,1));};
const mLabel=m=>{const p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});};
const mShort=m=>{const p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('en-IN',{month:'short'});};

const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d);};

const longDate=s=>parseD(s).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});

const ICONS={

  plus:'M12 5v14M5 12h14',
  list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
  chart:'M4 20V10M10 20V4M16 20v-7M22 20H2',
  calendar:'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4',
  user:'M20 21a8 8 0 0 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',
  trash:'M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14',
  check:'M5 13l4 4L19 7'
};
const ic=(n,s)=>`<svg width="${s||20}" height="${s||20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;
const markSvg=`<svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#8d9bff"/><path d="M8 11h16M8 16h16M8 21h9" stroke="#0b0e15" stroke-width="2.4" stroke-linecap="round" fill="none"/><circle cx="23" cy="21" r="2.2" fill="#0b0e15"/></svg>`;

/* ---------- categories ---------- */
const EXP=[
  {n:'Food & Dining',c:'#ff8f7a'},{n:'Groceries',c:'#f2c14e'},{n:'Transport',c:'#5fc7e8'},
  {n:'Rent & Bills',c:'#8d9bff'},{n:'Shopping',c:'#e58bd6'},{n:'Entertainment',c:'#b394ff'},
  {n:'Health',c:'#4fd1a5'},{n:'Education',c:'#7ad28a'},{n:'Travel',c:'#ffb36b'},
  {n:'Subscriptions',c:'#6fa8ff'},{n:'Other',c:'#9aa4b8'}
];
const INC=['Salary','Freelance','Gift','Interest','Other income'];
const catColor=n=>{const f=EXP.find(x=>x.n===n);return f?f.c:'#4fd1a5';};
const TIPS={

/* ---------- auth ---------- */
async function sha(pw,salt){
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=5381;const s=salt+':'+pw;
    for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}
    return 'x'+(h>>>0).toString(16);
  }
}
async function doSignup(name,email,pw){
  name=name.trim();email=email.trim().toLowerCase();
  if(name.length<2)return 'Enter your name.';
  if(!/^\S+@\S+\.\S+$/.test(email))return 'Enter a valid email address.';
  if(pw.length<6)return 'Use a password with at least 6 characters.';
  if(users.some(u=>u.email===email))return 'An account with this email already exists. Log in instead.';
  const salt=uid();
  const u={id:uid(),name:name,email:email,salt:salt,hash:await sha(pw,salt)};
  users.push(u);store.set('dbk_users',users);
  loginAs(u);return '';
}
async function doLogin(email,pw){
  email=email.trim().toLowerCase();
  const u=users.find(x=>x.email===email);
  if(!u)return 'No account found for this email. Sign up first.';
  if(await sha(pw,u.salt)!==u.hash)return 'That password is not right.';
  loginAs(u);return '';
}
function logout(){
  store.set('dbk_session',null);user=null;data=null;wiz=null;authErr='';authTab='login';
  render();
}

/* ---------- money logic ---------- */
function netAll(){let n=0;for(const t of data.tx)n+=t.type==='in'?t.amount:-t.amount;return n;}
function balance(){return (data.opening||0)+netAll();}
function balanceBefore(m){
  let n=data.opening||0;const cut=m+'-01';
  for(const t of data.tx){if(t.date<cut)n+=t.type==='in'?t.amount:-t.amount;}
  return n;
}
function stats(m){
  const s={income:0,spend:0,cat:{},need:0,want:0,n:0};
  for(const t of data.tx){
    if(t.date.indexOf(m)!==0)continue;
    s.n++;
    if(t.type==='in'){s.income+=t.amount;}
    else{s.spend+=t.amount;s.cat[t.cat]=(s.cat[t.cat]||0)+t.amount;if(t.kind==='need')s.need+=t.amount;else s.want+=t.amount;}
  }
  return s;
}
function insights(m){
  const s=stats(m),p=stats(addM(m,-1)),out=[],cur=m===ym(new Date());
  if(!s.n)return [{tone:'info',tag:'Start',t:'No entries for this month',b:'Add what you spent or received and Daybook will point out where to save.'}];
  if(s.income>0){
    const net=s.income-s.spend,r=net/s.income;
    if(net<0)out.push({tone:'bad',tag:'Alert',t:'You spent '+fmt(-net)+' more than you received',b:'Your balance is falling this month. Start with the wants listed here and pause any purchase that can wait.'});
    else if(r<0.2)out.push({tone:'warn',tag:'Watch',t:'You kept '+Math.round(r*100)+'% of what came in',b:'A common target is 20%. For this month that would be about '+fmt(s.income*0.2)+'.'});
    else out.push({tone:'good',tag:'Good',t:'You kept '+Math.round(r*100)+'% of what came in',b:'That is '+fmt(net)+' saved this month. Move it to savings before it gets spent.'});
  }else if(s.spend>0){
    out.push({tone:'info',tag:'Tip',t:'No money received is logged',b:'Add your salary or other income so the report can show your savings rate.'});
  }
  const cats=Object.entries(s.cat).sort((a,b)=>b[1]-a[1]);
  if(cats.length>1){
    const n=cats[0][0],v=cats[0][1],sh=v/s.spend;
    if(sh>=0.35)out.push({tone:'warn',tag:'Watch',t:n+' takes '+Math.round(sh*100)+'% of your spending',b:fmt(v)+' went here. '+(TIPS[n]||'')});
  }
  cats.forEach(function(c){
    const n=c[0],v=c[1],b=p.cat[n]||0;
    if(b>0&&v>b*1.2&&v-b>=300)out.push({tone:'warn',tag:'Cut',t:n+' is up '+Math.round((v/b-1)*100)+'% on last month',b:fmt(v)+' this month against '+fmt(b)+'. '+(TIPS[n]||'')});
  });
  if(s.spend>0){
    const w=s.want/s.spend;
    if(w>0.3)out.push({tone:'warn',tag:'Cut',t:Math.round(w*100)+'% of your spending was things you wanted',b:'Trimming wants by a quarter would free about '+fmt(s.want*0.25)+' a month, or '+fmt(s.want*0.25*12)+' a year.'});
  }
  const wants=data.tx.filter(t=>t.type==='out'&&t.kind==='want'&&t.date.indexOf(m)===0).sort((a,b)=>b.amount-a.amount).slice(0,3);
  if(wants.length)out.push({tone:'info',tag:'Tip',t:'Your biggest wants this month',b:wants.map(t=>(t.note||t.cat)+' ('+fmt(t.amount)+')').join(', ')+'. Ask yourself if each one was worth it.'});
  if(cur&&s.spend>0){
    const now=new Date(),day=now.getDate(),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
    if(day>=5){
      const proj=s.spend/day*dim;
      out.push({tone:(s.income>0&&proj>s.income)?'bad':'info',tag:'Pace',t:'At this pace you will spend about '+fmt(proj)+' this month',b:s.income>0?('You have received '+fmt(s.income)+' so far this month.'):'Log your income to compare it with this pace.'});
    }
  }
  return out;
}

function catBars(s){

function txRow(t,del){
  const c=t.type==='in'?'var(--in)':catColor(t.cat);
  return `<li class="tx"><span class="dot" style="background:${c}"></span><div><div class="tx-t">${esc(t.note||t.cat)}</div><div class="tx-s">${esc(t.cat)} · ${shortDate(t.date)}${t.kind?` · <span class="k-${t.kind}">${t.kind==='need'?'Need':'Want'}</span>`:''}${t.sample?' · sample':''}</div></div><div class="tx-a ${t.type}">${t.type==='in'?'+':'−'}${fmt2(t.amount)}</div>${del?`<button class="ico" data-a="deltx" data-id="${t.id}" aria-label="Delete entry">${ic('trash',18)}</button>`:''}</li>`;
}
function niceMax(x){const p=Math.pow(10,Math.floor(Math.log10(x)));const f=x/p;return (f<=1?1:f<=2?2:f<=4?4:f<=8?8:10)*p;}
const abbr=n=>n>=100000?(+(n/100000).toFixed(1))+'L':n>=1000?(+(n/1000).toFixed(1))+'k':String(Math.round(n));
function chart(endM){
  const ms=[];for(let i=5;i>=0;i--)ms.push(addM(endM,-i));
  const vals=ms.map(m=>{const s=stats(m);return {m:m,i:s.income,o:s.spend};});
  const max=Math.max(1,...vals.map(v=>Math.max(v.i,v.o)));
  const top=niceMax(max);
  const W=760,H=260,L=48,R=6,T=10,B=30,iw=W-L-R,ih=H-T-B,gw=iw/ms.length,bw=Math.min(34,gw/3);
  let g='';
  for(let k=0;k<=4;k++){
    const y=T+ih-ih*k/4;
    g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ax" x="${L-8}" y="${y+4}" text-anchor="end">${k?abbr(top*k/4):'0'}</text>`;
  }
  vals.forEach(function(v,idx){
    const cx=L+gw*idx+gw/2,hi=ih*v.i/top,ho=ih*v.o/top;
    g+=`<rect class="b-in" x="${cx-bw-2}" y="${T+ih-hi}" width="${bw}" height="${hi}" rx="3"/><rect class="b-out" x="${cx+2}" y="${T+ih-ho}" width="${bw}" height="${ho}" rx="3"/><text class="ax" x="${cx}" y="${H-9}" text-anchor="middle">${mShort(v.m)}</text>`;
  });
  const desc='Money in and money out for the last six months. '+vals.map(v=>mShort(v.m)+': in '+fmt(v.i)+', out '+fmt(v.o)).join('; ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(desc)}">${g}</svg><div class="legend"><span><i style="background:var(--in)"></i>Money in</span><span><i style="background:var(--out)"></i>Money out</span></div>`;
}

  return h+`<section class="card wiz"><div class="prog" aria-hidden="true">${prog}</div><div class="q">${body}<p class="err" role="alert">${esc(wiz.err)}</p>${actions}</div></section>`;
}
function wizNext(){
  const list=stepList(),key=list[wiz.step],d=wiz.d;
  wiz.err='';
  if(key==='amount'){const n=num(d.amount);if(!(n>0)){wiz.err='Enter an amount greater than zero.';render();return;}d.amount=String(n);}
  if(key==='date'){if(!d.date||d.date>todayS()){wiz.err='Choose today or an earlier date.';render();return;}}
  wiz.step++;render();
}
function wizSave(){
  const d=wiz.d,t={id:uid(),type:d.type,cat:d.cat,amount:num(d.amount),note:d.note.trim(),kind:d.type==='out'?d.kind:null,date:d.date};
  data.tx.push(t);save();wiz.done=t;render();
}

function viewHistory(){
  const rows=data.tx.filter(t=>t.date.indexOf(month)===0&&(hf==='all'||t.type===hf)).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  let html='',last='';
  rows.forEach(function(t){
    if(t.date!==last){if(last)html+='</ul>';html+=`<h3 class="day-h">${longDate(t.date)}</h3><ul class="tx-list">`;last=t.date;}
    html+=txRow(t,true);
  });
  if(last)html+='</ul>';
  const filt=[['all','All'],['out','Spent'],['in','Received']].map(f=>`<button class="chip ${hf===f[0]?'on':''}" data-a="hfilter" data-v="${f[0]}">${f[1]}</button>`).join('');
  return head('Every entry','History',monthNav())+`<section class="card"><div class="card-h"><div class="chips">${filt}</div><span class="muted">${rows.length} ${rows.length===1?'entry':'entries'}</span></div>${html||'<p class="muted">No entries for this month. Use Add to log one.</p>'}</section>`;
}

function viewReports(){
  const s=stats(month),p=stats(addM(month,-1)),open=balanceBefore(month),close=open+s.income-s.spend,net=s.income-s.spend;
  const cats=Object.entries(s.cat).sort((a,b)=>b[1]-a[1]);
  const trows=cats.map(function(c){
    const b=p.cat[c[0]]||0,diff=c[1]-b;
    const dl=b>0?`<span class="${diff>0?'down':'up'}">${diff>0?'▲':'▼'} ${fmt(Math.abs(diff))}</span>`:'<span class="muted">New</span>';
    return `<tr><td><span class="dot" style="background:${catColor(c[0])};display:inline-block;margin-right:8px"></span>${esc(c[0])}</td><td class="r num">${fmt(c[1])}</td><td class="r num">${Math.round(c[1]/s.spend*100)}%</td><td class="r num">${dl}</td></tr>`;
  }).join('');
  let rule='';
  if(s.income>0){
    const rows=[['Needs',s.need/s.income,0.5,'max'],['Wants',s.want/s.income,0.3,'max'],['Saved',Math.max(0,net)/s.income,0.2,'min']];
    rule=`<section class="card"><div class="card-h"><h2>Against the 50/30/20 guide</h2></div><p class="muted" style="margin-bottom:16px">Aim to spend up to 50% of income on needs, up to 30% on wants and save at least 20%.</p>`+rows.map(function(r){
      const ok=r[3]==='max'?r[1]<=r[2]:r[1]>=r[2];
      return `<div class="cb"><div class="cb-h"><span>${r[0]}</span><span class="num">${Math.round(r[1]*100)}% of income <em>${r[3]==='max'?'target up to':'target at least'} ${Math.round(r[2]*100)}%</em> <span class="pill ${ok?'pill-good':'pill-warn'}">${ok?'On track':'Over'}</span></span></div><div class="bar" style="--c:${ok?'var(--in)':'var(--warn)'}"><i style="width:${Math.min(100,r[1]*100).toFixed(1)}%"></i></div></div>`;
    }).join('')+`</section>`;
  }
  return head('Monthly report','Reports',monthNav())+`
  <div class="g2">
    <section class="card"><div class="card-h"><h2>Money added and removed</h2></div><div class="ledger">
      <div class="lr"><span>Balance on ${shortDate(month+'-01')}</span><span class="num">${fmt(open)}</span></div>
      <div class="lr"><span>Added (money in)</span><span class="num up">+${fmt(s.income)}</span></div>
      <div class="lr"><span>Removed (money out)</span><span class="num down">−${fmt(s.spend)}</span></div>
      <div class="lr"><span>Balance at month end</span><span class="num">${fmt(close)}</span></div></div>
      <p class="muted" style="margin-top:14px">${s.n?`Your balance ${net>=0?'grew':'shrank'} by ${fmt(Math.abs(net))} in ${mLabel(month)}.`:'No entries for this month.'}</p></section>
    <section class="card"><div class="card-h"><h2>What to change</h2></div>${insList(insights(month),6)}</section>
  </div>
  ${cats.length?`<section class="card"><div class="card-h"><h2>Spending by category</h2><span class="muted">Change is against ${mShort(addM(month,-1))}</span></div><div class="tbl"><table><thead><tr><th>Category</th><th class="r">Spent</th><th class="r">Share</th><th class="r">Change</th></tr></thead><tbody>${trows}</tbody></table></div></section>`:''}
  ${s.spend>0?`<section class="card"><div class="card-h"><h2>Needs and wants</h2></div><div class="cb"><div class="cb-h"><span>Needs</span><span class="num">${fmt(s.need)} <em>${Math.round(s.need/s.spend*100)}%</em></span></div><div class="bar" style="--c:var(--in)"><i style="width:${(s.need/s.spend*100).toFixed(1)}%"></i></div></div><div class="cb"><div class="cb-h"><span>Wants</span><span class="num">${fmt(s.want)} <em>${Math.round(s.want/s.spend*100)}%</em></span></div><div class="bar" style="--c:var(--warn)"><i style="width:${(s.want/s.spend*100).toFixed(1)}%"></i></div></div></section>`:''}
  ${rule}
  <section class="card"><div class="card-h"><h2>Six month trend</h2></div>${chart(month)}</section>`;
}

/* planner */
const PR={high:0,med:1,low:2};
function taskSort(a,b){
  if(a.due!==b.due)return a.due<b.due?-1:1;
  if((a.time||'99')!==(b.time||'99'))return (a.time||'99')<(b.time||'99')?-1:1;
  return PR[a.priority]-PR[b.priority];
}
function dueInfo(t){
  if(t.done)return {tone:'good',text:'Done'};
  const n=diffDays(t.due,todayS());
  if(n<0)return {tone:'bad',text:'Overdue by '+(-n)+(n===-1?' day':' days')};
  if(n===0)return {tone:'bad',text:'Due today'+(t.time?' at '+t.time:'')};
  if(n===1)return {tone:'warn',text:'Due tomorrow'+(t.time?' at '+t.time:'')};
  if(n<=3)return {tone:'warn',text:'In '+n+' days'};
  return {tone:'info',text:'In '+n+' days'};
}
function taskCard(t){
  const di=dueInfo(t),pr={high:'High priority',med:'Medium priority',low:'Low priority'}[t.priority];
  let hint='';
  if(!t.done&&t.hours>0){
    const need=Math.ceil(t.hours/3),sb=addDays(t.due,-need),n=diffDays(t.due,todayS());
    hint=n<0?'':(sb<=todayS()?`About ${t.hours} hrs of work. Start today to finish on time.`:`About ${t.hours} hrs of work. Start by ${longDate(sb)}.`);
  }
  return `<article class="task ${t.done?'is-done':''}"><button class="tick ${t.done?'done':''}" data-a="togglet" data-id="${t.id}" aria-label="${t.done?'Mark as not done':'Mark as done'}" aria-pressed="${t.done}">${t.done?ic('check',14):''}</button>
  <div><h3>${esc(t.title)}</h3>${t.details?`<p class="det">${esc(t.details)}</p>`:''}
  <div class="meta"><span class="pill pill-${di.tone}">${esc(di.text)}</span><span class="pill">${longDate(t.due)}</span>${t.priority==='high'&&!t.done?`<span class="pill pill-bad">${pr}</span>`:`<span class="pill">${pr}</span>`}${t.to?`<span class="pill">For ${esc(t.to)}</span>`:''}${t.sample?'<span class="pill">sample</span>':''}</div>${hint?`<p class="plan-hint">${hint}</p>`:''}</div>
  <button class="ico" data-a="delt" data-id="${t.id}" aria-label="Delete task">${ic('trash',18)}</button></article>`;
}
function weekStrip(){
  const t0=todayS();let cells='',tc=0,th=0;
  for(let i=0;i<7;i++){
    const ds=addDays(t0,i),ts=data.tasks.filter(t=>!t.done&&t.due===ds),hr=ts.reduce((a,t)=>a+(t.hours||0),0);
    tc+=ts.length;th+=hr;
    cells+=`<div class="wd ${i===0?'today':''} ${ts.length?'has':''} ${hr>=6?'heavy':''}" title="${ts.length} due, ${hr} hrs of work"><small>${parseD(ds).toLocaleDateString('en-IN',{weekday:'short'})}</small><b>${parseD(ds).getDate()}</b><em>${ts.length?ts.length+(ts.length===1?' due':' due'):'Free'}</em></div>`;
  }
  const od=data.tasks.filter(t=>!t.done&&t.due<t0).length;
  return `<div class="week">${cells}</div><p class="muted" style="margin-top:12px">${tc?`${tc} ${tc===1?'task is':'tasks are'} due this week, about ${th} hrs of work.`:'Nothing is due in the next 7 days.'}${od?` ${od} ${od===1?'task is':'tasks are'} overdue.`:''}</p>`;
}
function taskGroups(){
  const t0=todayS(),open=data.tasks.filter(t=>!t.done).sort(taskSort),done=data.tasks.filter(t=>t.done).sort(taskSort);
  const g=[['Overdue','bad',open.filter(t=>t.due<t0)],['Due today','bad',open.filter(t=>t.due===t0)],['Next 7 days','warn',open.filter(t=>{const n=diffDays(t.due,t0);return n>=1&&n<=7;})],['Later','info',open.filter(t=>diffDays(t.due,t0)>7)]];
  let h=g.filter(x=>x[2].length).map(x=>`<div class="grp"><div class="grp-h"><span class="pill pill-${x[1]}">${x[0]}</span><span>${x[2].length}</span></div>${x[2].map(taskCard).join('')}</div>`).join('');
  if(!data.tasks.length)h='<p class="muted">No work added yet. Fill in the form with the title, details and submission date of your first task.</p><div class="actions"><button class="btn" data-a="sample">Load sample data</button></div>';
  else if(!open.length)h='<p class="muted">Everything is done. Add the next piece of work when it arrives.</p>';
  if(done.length)h+=`<details class="grp"><summary>Completed (${done.length})</summary>${done.map(taskCard).join('')}</details>`;
  return h;
}
function viewPlanner(){
  return head('Work and deadlines','Schedule planner')+`
  <section class="card"><div class="card-h"><h2>The next 7 days</h2></div><div id="week">${weekStrip()}</div></section>
  <div class="plan">
    <section class="card"><h2>Add work</h2>
      <form class="form" id="task-form" novalidate>
        <label class="field"><span>Title</span><input id="t-title" maxlength="100" placeholder="e.g. Database project report" required></label>
        <label class="field"><span>Details</span><textarea id="t-details" maxlength="600" placeholder="What is needed, format, anything to remember"></textarea></label>
        <div class="row2"><label class="field"><span>Submission date</span><input id="t-due" type="date" required value="${addDays(todayS(),3)}"></label>
        <label class="field"><span>Time (optional)</span><input id="t-time" type="time"></label></div>
        <div class="row2"><label class="field"><span>Priority</span><select id="t-priority"><option value="high">High</option><option value="med" selected>Medium</option><option value="low">Low</option></select></label>
        <label class="field"><span>Hours needed</span><input id="t-hours" inputmode="decimal" placeholder="e.g. 4"></label></div>
        <label class="field"><span>Submit to (optional)</span><input id="t-to" maxlength="60" placeholder="Teacher, client or team"></label>
        <p class="err" id="t-err" role="alert"></p>
        <button class="btn btn-primary" type="submit">${ic('plus',18)} Add to planner</button>
      </form></section>
    <section class="card"><div class="card-h"><h2>Your work</h2></div><div id="task-list">${taskGroups()}</div></section>
  </div>`;
}
function refreshTasks(){const l=$('#task-list'),w=$('#week');if(l)l.innerHTML=taskGroups();if(w)w.innerHTML=weekStrip();}

function viewAccount(){
  return head('Your profile','Account')+`
  <section class="card"><h2>Profile</h2><p><b>${esc(user.name)}</b></p><p class="muted">${esc(user.email)}</p><div class="actions"><button class="btn" data-a="logout">Log out</button></div></section>
  <section class="card"><h2>Bank balance</h2>
    <p class="muted" style="margin-bottom:14px">${data.opening===null?'Not set yet.':`Daybook shows ${fmt(balance())}. If your bank app shows a different number, enter it here to correct it.`}</p>
    <div class="row2"><label class="field"><span>Balance in your bank</span><input id="acc-bal" inputmode="decimal" placeholder="${data.opening===null?'0':String(Math.round(balance()))}"></label></div>
    <p class="err" id="acc-err" role="alert"></p>
    <div class="actions" style="margin-top:6px"><button class="btn btn-primary" data-a="adjbal">Update balance</button></div></section>
  <section class="card"><h2>Your data</h2><p class="muted" style="margin-bottom:14px">Accounts and entries are stored in this browser on this device. Clearing site data or using another browser starts fresh.</p>
    <div class="actions"><button class="btn" data-a="sample">Load sample data</button><button class="btn" data-a="rmsample">Remove sample data</button>
    ${confirmClear?'<button class="btn btn-danger" data-a="clearall">Yes, delete all my entries and tasks</button><button class="btn" data-a="cancelclear">Cancel</button>':'<button class="btn btn-danger" data-a="clearall">Delete all my data</button>'}</div></section>`;
}

function page(){
  switch(view){
    case 'add':return viewAdd();
    case 'history':return viewHistory();
    case 'reports':return viewReports();
    case 'planner':return viewPlanner();
    case 'account':return viewAccount();
    default:return viewHome();
  }
}
function shell(){
  const items=[['home','Overview','home'],['add','Add','plus'],['history','History','list'],['reports','Reports','chart'],['planner','Planner','calendar'],['account','Account','user']];
  const nav=items.map(i=>`<a class="nav-i ${view===i[0]?'on':''}" href="#${i[0]}" ${view===i[0]?'aria-current="page"':''}>${ic(i[2])}<span>${i[1]}</span></a>`).join('');
  return `<div class="shell"><aside class="side"><div class="brand">${markSvg}Daybook</div><nav class="nav" aria-label="Main">${nav}</nav><div class="side-foot"><span class="who">${esc(user.name)}</span><button class="link" data-a="logout">Log out</button></div></aside>
  <main class="main"><header class="topbar"><div class="brand">${markSvg}Daybook</div></header>${page()}</main><nav class="tabbar" aria-label="Main">${nav}</nav></div>`;
}
function authView(){
  const su=authTab==='signup';
  return `<div class="auth"><section><div class="brand">${markSvg}Daybook</div><h1>One book for what you spend and what is due.</h1>
  <p class="lead">Log each expense by answering a few quick questions. Add your work with its submission date. Daybook keeps your balance, your monthly report and your deadlines in one place.</p>
  <ul class="pts"><li>${ic('check',18)}<span>Expense entries that ask simple questions, one at a time</span></li><li>${ic('check',18)}<span>Monthly reports that show where to cut and what you saved</span></li><li>${ic('check',18)}<span>A planner that sorts your work by submission date and tells you when to start</span></li></ul></section>
  <section class="card"><div class="tabs" role="tablist"><button role="tab" class="${su?'':'on'}" data-a="tab" data-v="login" aria-selected="${!su}">Log in</button><button role="tab" class="${su?'on':''}" data-a="tab" data-v="signup" aria-selected="${su}">Sign up</button></div>
  <form class="form" id="auth-form" novalidate>
    ${su?'<label class="field"><span>Your name</span><input id="f-name" autocomplete="name" placeholder="Akash" data-autofocus></label>':''}
    <label class="field"><span>Email</span><input id="f-email" type="email" autocomplete="email" placeholder="you@example.com" ${su?'':'data-autofocus'}></label>
    <label class="field"><span>Password</span><input id="f-pass" type="password" autocomplete="${su?'new-password':'current-password'}" placeholder="${su?'At least 6 characters':'Your password'}"></label>
    <p class="err" role="alert">${esc(authErr)}</p>
    <button class="btn btn-primary" type="submit" id="auth-btn">${su?'Create account':'Log in'}</button>
    <p class="note">Accounts are saved in this browser only. Your data does not leave this device.</p>
  </form></section></div>`;
}
function render(){
  const app=$('#app');
  app.innerHTML=user?shell():authView();
  const af=$('[data-autofocus]');
  if(af){try{af.focus({preventScroll:true});}catch(e){}}
}

/* ---------- toast ---------- */
function toast(msg,undo){
  const el=$('#toast');lastUndo=undo||null;
  el.innerHTML=esc(msg)+(undo?' <button data-a="undo">Undo</button>':'');
  el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),5000);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,v=el.dataset.v,id=el.dataset.id;
  switch(a){
    case 'tab':authTab=v;authErr='';render();break;
    case 'logout':logout();break;
    case 'gohome':go('home');break;
    case 'newentry':wiz=null;if(view==='add')render();else go('add');break;
    case 'mprev':month=addM(month,-1);render();break;
    case 'mnext':if(month<ym(new Date())){month=addM(month,1);render();}break;
    case 'hfilter':hf=v;render();break;
    case 'wtype':wiz.d.type=v;wiz.d.cat=null;wiz.d.kind=null;wiz.step++;wiz.err='';render();break;
    case 'wcat':wiz.d.cat=v;wiz.step++;wiz.err='';render();break;
    case 'wkind':wiz.d.kind=v;wiz.step++;wiz.err='';render();break;
    case 'wdate':wiz.d.date=addDays(todayS(),Number(v));render();break;
    case 'wback':if(wiz.step>0){wiz.step--;wiz.err='';render();}break;
    case 'wnext':wizNext();break;
    case 'wsave':wizSave();break;
    case 'deltx':{
      const i=data.tx.findIndex(t=>t.id===id);if(i<0)break;
      const gone=data.tx.splice(i,1)[0];save();render();
      toast('Entry deleted.',function(){data.tx.push(gone);save();render();});break;}
    case 'togglet':{
      const t=data.tasks.find(x=>x.id===id);if(!t)break;
      t.done=!t.done;save();
      if(view==='planner')refreshTasks();else render();
      if(t.done)toast('Marked as done.');break;}
    case 'delt':{
      const i=data.tasks.findIndex(t=>t.id===id);if(i<0)break;
      const gone=data.tasks.splice(i,1)[0];save();
      if(view==='planner')refreshTasks();else render();
      toast('Task deleted.',function(){data.tasks.push(gone);save();if(view==='planner')refreshTasks();else render();});break;}
    case 'undo':if(lastUndo){lastUndo();lastUndo=null;}$('#toast').classList.remove('show');break;
    case 'savebal':{
      const n=num(($('#open-bal')||{}).value);
      if(isNaN(n)){const er=$('#open-err');if(er)er.textContent='Enter a number, for example 25000.';break;}
      data.opening=n-netAll();save();render();toast('Balance saved.');break;}
    case 'adjbal':{
      const n=num(($('#acc-bal')||{}).value);
      if(isNaN(n)){const er=$('#acc-err');if(er)er.textContent='Enter a number, for example 25000.';break;}
      data.opening=n-netAll();save();render();toast('Balance updated.');break;}
    case 'sample':{
      const s=makeSample();
      if(data.opening===null)data.opening=45000;
      data.tx=data.tx.concat(s.tx);data.tasks=data.tasks.concat(s.tasks);save();render();
      toast('Sample data loaded. Remove it any time in Account.');break;}
    case 'rmsample':
      data.tx=data.tx.filter(t=>!t.sample);data.tasks=data.tasks.filter(t=>!t.sample);save();render();toast('Sample data removed.');break;
    case 'clearall':
      if(!confirmClear){confirmClear=true;render();}
      else{data.tx=[];data.tasks=[];data.opening=null;confirmClear=false;save();render();toast('All your data was deleted.');}
      break;
    case 'cancelclear':confirmClear=false;render();break;
  }
});
document.addEventListener('input',function(e){
  const w=e.target.dataset&&e.target.dataset.w;
  if(w&&wiz){wiz.d[w]=e.target.value;}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.w&&wiz){e.preventDefault();wizNext();}
  if(e.key==='Enter'&&e.target.id==='open-bal'){e.preventDefault();const b=document.querySelector('[data-a="savebal"]');if(b)b.click();}
  if(e.key==='Enter'&&e.target.id==='acc-bal'){e.preventDefault();const b=document.querySelector('[data-a="adjbal"]');if(b)b.click();}
});
document.addEventListener('submit',async function(e){
  e.preventDefault();
  if(e.target.id==='auth-form'){
    const btn=$('#auth-btn');if(btn)btn.disabled=true;
    const email=$('#f-email').value,pw=$('#f-pass').value;
    authErr=authTab==='signup'?await doSignup($('#f-name').value,email,pw):await doLogin(email,pw);
    if(!authErr){view=VIEWS.indexOf(location.hash.slice(1))>=0?location.hash.slice(1):'home';month=ym(new Date());}
    render();
  }
  if(e.target.id==='task-form'){
    const title=$('#t-title').value.trim(),due=$('#t-due').value,er=$('#t-err');
    if(!title){er.textContent='Give the work a title.';return;}
    if(!due){er.textContent='Choose the submission date.';return;}
    const hrs=num($('#t-hours').value);
    data.tasks.push({id:uid(),title:title,details:$('#t-details').value.trim(),due:due,time:$('#t-time').value,priority:$('#t-priority').value,hours:isNaN(hrs)?0:hrs,to:$('#t-to').value.trim(),done:false});
    save();
    ['t-title','t-details','t-time','t-hours','t-to'].forEach(i=>{$('#'+i).value='';});
    er.textContent='';refreshTasks();toast('Added to your planner.');
  }
});

render();
})();
</script>

</body></html>
